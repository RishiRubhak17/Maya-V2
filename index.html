    <meta charset="UTF-8" />
    <script>
      (function () {
        // Environment constraint: HMR is disabled in AI Studio. Ignore WebSocket errors.
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          function isViteHmr(url, protocols) {
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') return true;
            if (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) return true;
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 && url.indexOf('vite') !== -1)) return true;
            return false;
          }

          function MockHmrWebSocket(url, protocols) {
            var target = document.createDocumentFragment();
            this.addEventListener = target.addEventListener.bind(target);
            this.removeEventListener = target.removeEventListener.bind(target);
            this.dispatchEvent = target.dispatchEvent.bind(target);

            this.readyState = 1; // OPEN
            this.url = typeof url === 'string' ? url : String(url || '');
            this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
            this.bufferedAmount = 0;
            this.extensions = '';
            this.binaryType = 'blob';
            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;

            var self = this;
            setTimeout(function () {
              var ev = new Event('open');
              self.dispatchEvent(ev);
              if (typeof self.onopen === 'function') self.onopen(ev);
            }, 0);
          }

          MockHmrWebSocket.prototype.CONNECTING = 0;
          MockHmrWebSocket.prototype.OPEN = 1;
          MockHmrWebSocket.prototype.CLOSING = 2;
          MockHmrWebSocket.prototype.CLOSED = 3;

          MockHmrWebSocket.prototype.send = function () {};
          MockHmrWebSocket.prototype.close = function () {
            this.readyState = 3;
            var self = this;
            setTimeout(function () {
              var ev = new CloseEvent('close', { code: 1000, reason: 'Normal Closure', wasClean: true });
              self.dispatchEvent(ev);
              if (typeof self.onclose === 'function') self.onclose(ev);
            }, 0);
          };

          window.WebSocket = function (url, protocols) {
            if (isViteHmr(url, protocols)) {
              return new MockHmrWebSocket(url, protocols);
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress [vite] connection error logs captured by the environment
        var origConsoleError = console.error;
        console.error = function () {
          var firstArg = arguments[0];
          if (
            typeof firstArg === 'string' &&
            (firstArg.indexOf('[vite]') !== -1 || firstArg.indexOf('WebSocket closed without opened') !== -1)
          ) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function (e) {
          if (
            e.reason &&
            ((e.reason.message && e.reason.message.indexOf('WebSocket') !== -1) ||
              (typeof e.reason === 'string' && e.reason.indexOf('WebSocket') !== -1))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });

        window.addEventListener(
          'error',
          function (e) {
            if (e.message && e.message.indexOf('WebSocket') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
